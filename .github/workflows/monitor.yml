name: StarPets MM2 price monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: mm2-monitor
  cancel-in-progress: false

jobs:
  check-prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: pip install -r requirements.txt

      - run: python3 monitor.py
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}

      - run: python3 dashboard_data.py

      - name: Persist state and dashboard data
        run: |
          git config user.name "mm2-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json docs/data.json
          git diff --cached --quiet && exit 0
          git commit -m "Update alert state and dashboard data [skip ci]"
          git push
